name: TapeWatch scheduled monitoring

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tapewatch-scheduled-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run due website checks
        env:
          TAPEWATCH_APP_URL: ${{ secrets.TAPEWATCH_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${TAPEWATCH_APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing TAPEWATCH_APP_URL or CRON_SECRET repository secrets."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 540 \
            --request GET "${TAPEWATCH_APP_URL%/}/api/cron/monitor" \
            --header "Authorization: Bearer ${CRON_SECRET}")"
          printf '%s\n' "$response"
          {
            echo "## Scheduled monitoring result"
            echo '```json'
            printf '%s\n' "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
